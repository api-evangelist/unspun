name: Unspun
description: Unspun is a fashion-technology company building Vega, the world's first 3D
  weaving machines, which transform yarn directly into finished woven garments in
  about twenty minutes for automated, localized, on-demand apparel manufacturing.
  Founded by Beth Esponnette, Walden Lam, and Kevin Martin and operating from Oakland,
  California and Hong Kong, the company pairs its weaving hardware with software for
  custom-fit patternmaking and design automation, working with manufacturers and
  brands to eliminate overproduction, with a mission of reducing global human carbon
  emissions by one percent. Unspun is backed by DCVC and does not currently publish
  a public API or developer program.
